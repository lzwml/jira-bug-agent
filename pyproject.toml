[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-bug-agent"
version = "0.1.0"
description = "Evidence-driven Android bug analysis agent with Jira and log MCP tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jira-bug-mcp>=0.1.0",
    "log-analyzer-mcp>=0.3.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
bug-agent = "bug_agent.cli:main"
bug-agent-api = "bug_agent.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bug_agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bug_agent_builtin_skills"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.test-*",
    "/.uv-cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
jira-bug-mcp = { workspace = true }
log-analysis-core = { workspace = true }
log-analyzer-mcp = { workspace = true }
