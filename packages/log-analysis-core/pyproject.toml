[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "log-analysis-core"
version = "0.1.0"
description = "Deterministic Android and kernel log parsing primitives"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/log_analysis_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
