[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-local-mcp"
version = "0.1.0"
description = "MCP server for reading local source code identified by OpenGrok search results"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/code_local_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
code-local-mcp = "code_local_mcp.server:main"