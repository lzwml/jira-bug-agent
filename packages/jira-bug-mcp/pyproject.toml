[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-bug-mcp"
version = "0.1.0"
description = "Read-only Jira context and controlled Bug Case export for engineering agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jira_bug_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
jira-bug-mcp = "jira_bug_mcp.server:main"
