[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengrok-mcp"
version = "0.1.0"
description = "Lightweight Python MCP server for OpenGrok code search engine"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/opengrok_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
opengrok-mcp = "opengrok_mcp.server:main"