[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-analysis-mcp"
version = "0.1.0"
description = "Secure video evidence and vision analysis MCP for Bug Agent"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
video-analysis = "video_analysis.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
